<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Job Feed</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://unpkg.com/lucide@latest"></script>
  </head>
  <body>
    <div class="container">
      <header class="fixed-header">
        <div class="nav-content">
          <div class="nav-left">
            <div class="profile-combobox">
              <div class="avatar">A</div>
              <span class="name">John Doe</span>
              <i data-lucide="chevron-down"></i>
            </div>
            <nav class="nav-links">
              <a href="#" class="nav-link">Dashboard</a>
              <a href="#" class="nav-link">Jobs</a>
              <a href="#" class="nav-link">Applications</a>
              <a href="#" class="nav-link">Interview Prep</a>
              <a href="#" class="nav-link">Settings</a>
            </nav>
          </div>
          <div class="nav-right">
            <div class="search-bar">
              <input type="text" placeholder="Search..." />
            </div>
            <button class="notification-btn">
              <i data-lucide="bell"></i>
            </button>
            <div class="profile-avatar">J</div>
          </div>
        </div>
      </header>

      <!-- content -->
      <div class="content">
        <div class="heading">
          <div class="text-container">
            <h1>Job Feed</h1>
            <p>discover opportunities tailored to your profile.</p>
          </div>
          <div class="view-icons">
            <button class="view-btn active">
              <i data-lucide="list"></i>
            </button>

            <button class="view-btn disabled">
              <i data-lucide="grid-3x3"></i>
            </button>
          </div>
        </div>

        <!-- tabs -->
        <div class="tabs">
          <button class="tab active">Best Matches</button>
          <button class="tab">Saved Jobs</button>
        </div>

        <div class="find-jobs">
          <div class="find-container">
            <div class="search-bar-content ">
              <input type="text" placeholder="Search jobs, companies.."/>
            </div>

            <div class="cta">
              <button class="btn-pri">Search</button>
              <button class="btn-sec"><i data-lucide="filter"></i> Filter</button>
            </div>
          </div>

          <div class="help-text">Popular: Frontend Developer</div>
        </div>
      </div>
    </div>

    <script>
      lucide.createIcons();
    </script>
  </body>
</html>
